services:
  db:
    image: pgvector/pgvector:pg15-trixie
    restart: always
    env_file:
      - .env
    ports:
      - "5433:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d postgres || exit 1",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
  migrator:
    build: ./
    image: notes-app-be-backend:latest
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    command: >
      sh -lc "
        echo '⏳ Waiting for DB...';
        node -e 'require(\"net\").connect(5432, \"db\").on(\"connect\",()=>process.exit(0)).on(\"error\",()=>process.exit(1))' || exit 1;
        npx prisma generate &&
        npm run db:backfill-content-md &&
        npx prisma migrate deploy &&
        echo '✅ Prisma ready'
      "
    restart: "no"
  backend:
    build: ./
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      # Ollama (RAG embeddings / local models) runs on the host, not in this container.
      # Override with AI_OLLAMA_URL_DOCKER in .env (e.g. a remote Ollama).
      AI_OLLAMA_URL: ${AI_OLLAMA_URL_DOCKER:-http://host.docker.internal:11434}
    extra_hosts:
      # Makes host.docker.internal resolve on Linux too (built in on Docker Desktop).
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    volumes:
      - ./:/app
  frontend:
    build: ../notes-app-fe
    ports:
      - "5173:5173"
    volumes:
      - ../notes-app-fe/:/app
      - /app/node_modules
volumes:
  postgres_data:
